<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Page not found — GeckoGames</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet"/>
<link rel="icon" type="image/png" href="/images/favicon.png"/>
<link rel="stylesheet" href="/game.css"/>
</head><body>
<header><a class="logo" href="/">GECKO<span>GAMES</span></a><a class="back-btn" href="/">← Back to Games</a></header>
<div style="text-align:center;padding:4rem 2rem">
  <img src="/mascot.svg" alt="" width="140" height="140"/>
  <h1 class="game-title" style="margin-top:1rem">Oops! This page ran away.</h1>
  <p style="color:#8888aa;font-size:.8rem;margin-bottom:2rem">Our gecko couldn't find what you were looking for.</p>
  <a class="ov-play" href="/">BACK TO GAMES</a>
  <button class="ov-play" style="margin-left:.8rem" id="rnd">🎲 RANDOM GAME</button>
</div>
<script>
document.getElementById('rnd').onclick = function () {
  fetch('/games.json').then(r => r.json()).then(a => { a = a.filter(g => !g.hidden); location.href = '/games/' + a[Math.floor(Math.random() * a.length)].id + '/'; });
};
</script>
</body></html>
