  <style>
    :root { --bg:#eef0ff; --surface:#fff; --card:#fff; --accent:#3d5afe; --accent2:#ff7a1a; --accent3:#0b8a6e; --yellow:#ffd23f; --text:#17153b; --muted:#5b5a7e; --border:#17153b; }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background:var(--bg); color:var(--text); font-family:'Outfit',system-ui,sans-serif; font-size:17px; line-height:1.5; min-height:100vh; overflow-x:hidden; }
    :focus-visible { outline:3px solid var(--accent); outline-offset:3px; }
    header { padding:0 max(1.5rem,calc((100% - 1200px)/2)); display:flex; align-items:center; justify-content:space-between; height:66px; position:sticky; top:0; background:var(--yellow); border-bottom:3px solid var(--border); z-index:100; }
    .logo { font-family:'Unbounded',sans-serif; font-size:1.3rem; font-weight:800; color:var(--text); display:flex; align-items:center; }
    .logo span { color:var(--accent); }

    nav a { color:var(--text); text-decoration:none; font-weight:600; margin-left:1.5rem; border-bottom:2px solid transparent; }
    nav a:hover { border-bottom-color:var(--text); }
    .ad-banner { background:var(--surface); border-bottom:3px solid var(--border); padding:.6rem 1.5rem; text-align:center; }

    .hero { max-width:1200px; margin:0 auto; padding:4rem 1.5rem 1.5rem; }
    .hero h1 { font-family:'Unbounded',sans-serif; font-size:clamp(2.1rem,6vw,4.4rem); font-weight:800; line-height:1.05; letter-spacing:-.03em; max-width:14ch; }
    .hero p { margin-top:1.2rem; color:var(--muted); font-size:1.2rem; max-width:36ch; }
    .stats-bar { max-width:1200px; margin:0 auto; padding:0 1.5rem 2rem; font-size:.95rem; font-weight:500; color:var(--muted); }
    .stats-bar b { color:var(--accent); font-weight:700; }
    .gotd { display:none; max-width:1200px; margin:0 auto 3rem; padding:0 1.5rem; }
    .gotd.show { display:block; }
    .gotd a { display:flex; background:var(--accent); color:#fff; border:3px solid var(--border); border-radius:22px; overflow:hidden; text-decoration:none; box-shadow:8px 8px 0 var(--border); transition:transform .15s, box-shadow .15s; }
    .gotd a:hover { transform:translate(4px,4px); box-shadow:4px 4px 0 var(--border); }
    .gotd img { width:48%; aspect-ratio:16/9; object-fit:cover; display:block; border-right:3px solid var(--border); }
    .gotd-info { padding:2rem 2.2rem; display:flex; flex-direction:column; justify-content:center; align-items:flex-start; gap:.6rem; }
    .gotd-label { background:var(--yellow); color:var(--text); font-weight:700; font-size:.85rem; padding:.15rem .8rem; border-radius:999px; border:2px solid var(--border); }
    .gotd-title { font-family:'Unbounded',sans-serif; font-size:clamp(1.6rem,3.5vw,2.6rem); font-weight:800; line-height:1.1; }
    .gotd .game-desc { color:#e4e8ff; }
    .gotd .play-btn { background:var(--yellow); color:var(--text); border:2px solid var(--border); }
    @media (max-width:768px) { .gotd a { flex-direction:column; } .gotd img { width:100%; border-right:0; border-bottom:3px solid var(--border); } .gotd-info { padding:1.3rem; } .hero { padding-top:2.5rem; } }

    @media (max-width:768px) { .main-layout { grid-template-columns:1fr; } .sidebar { display:none; } }
    .games-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:1.5rem; }

    .play-btn { display:inline-block; margin-top:.8rem; background:var(--accent); color:#fff; font-size:.9rem; font-weight:700; padding:.35rem 1rem; border-radius:999px; text-decoration:none; }

    .sidebar .ad-placeholder { position:sticky; top:86px; }
    .tag2 { display:inline-block; margin-left:6px; background:var(--accent2); color:#fff; padding:1px 8px; border-radius:999px; font-size:.7rem; font-weight:700; }
    .see-all { margin-top:1.2rem; }
    .section-title { font-family:'Unbounded',sans-serif; font-size:1.35rem; font-weight:800; margin-bottom:1.3rem; }
    .section-title span { color:inherit; }
    footer { background:var(--text); color:#c9c8e6; padding:2rem 1.5rem; text-align:center; font-size:.9rem; }
    footer a { color:var(--yellow); text-decoration:none; }
    footer a:hover { text-decoration:underline; }
    .search-bar { width:100%; background:#fff; border:3px solid var(--border); border-radius:999px; padding:.8rem 1.4rem; color:var(--text); font-family:inherit; font-size:1.05rem; outline:none; margin-bottom:1rem; box-shadow:4px 4px 0 var(--border); }
    .search-bar::placeholder { color:var(--muted); }
    .search-bar:focus { border-color:var(--accent); box-shadow:4px 4px 0 var(--accent); }
    .no-results { display:none; color:var(--muted); padding:2rem 0; }
    .cat-bar { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:2rem; }
    .cat-btn { background:#fff; border:2px solid var(--border); color:var(--text); font-family:inherit; font-size:.9rem; font-weight:600; padding:.3rem .9rem; border-radius:999px; cursor:pointer; transition:background .15s; }
    .cat-btn:hover { background:var(--yellow); }
    .cat-btn.active { background:var(--text); color:var(--yellow); }
    .cat-btn small { opacity:.7; margin-left:5px; font-size:.75rem; }
    .cat-btn.rand { background:var(--accent2); color:#fff; }
    .cat-btn.rand:hover { background:var(--yellow); color:var(--text); }
    .favorites-section { display:none; max-width:1200px; margin:0 auto; padding:0 1.5rem 2.5rem; }
    .favorites-section.has-favorites { display:block; }
    #favoritesGrid, #popularGrid, #recentGrid, #friendGrid { display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:1.2rem; }
    #favoritesGrid .game-info, #popularGrid .game-info, #recentGrid .game-info, #friendGrid .game-info { padding:.65rem .85rem .75rem; }
    #favoritesGrid .game-title, #popularGrid .game-title, #recentGrid .game-title, #friendGrid .game-title { font-size:.85rem; margin-bottom:0; }
    #favoritesGrid .game-desc, #popularGrid .game-desc, #recentGrid .game-desc, #friendGrid .game-desc, #favoritesGrid .play-btn, #popularGrid .play-btn, #recentGrid .play-btn, #friendGrid .play-btn { display:none; }
    .star-btn { position:absolute; bottom:8px; right:10px; background:none; border:none; font-size:1.4rem; cursor:pointer; line-height:1; z-index:10; }
    .star-btn.starred { color:var(--accent2); }
    .star-btn.unstarred { color:#b9b8d6; }
    .remove-fav-btn { position:absolute; top:8px; right:8px; background:var(--accent2); border:2px solid var(--border); color:#fff; font-size:.75rem; width:28px; height:28px; border-radius:50%; cursor:pointer; z-index:10; display:flex; align-items:center; justify-content:center; opacity:0; padding:0; }
    #favoritesGrid .game-card:hover .remove-fav-btn, .remove-fav-btn:focus-visible { opacity:1; }
    .badge-new { position:absolute; top:10px; left:10px; z-index:5; background:var(--yellow); color:var(--text); border:2px solid var(--border); font-size:.75rem; font-weight:700; padding:.1rem .6rem; border-radius:999px; }
    .pagination { display:flex; align-items:center; justify-content:center; gap:6px; margin:2.2rem 0 1rem; flex-wrap:wrap; }
    .pagination button { background:#fff; border:2px solid var(--border); color:var(--text); font-family:inherit; font-size:.9rem; font-weight:600; padding:.35rem .9rem; border-radius:999px; cursor:pointer; }
    .pagination button:hover:not(:disabled) { background:var(--yellow); }
    .pagination button.active { background:var(--text); color:var(--yellow); }
    .pagination button:disabled { opacity:.35; cursor:not-allowed; }
    .page-info { font-size:.9rem; color:var(--muted); text-align:center; margin-bottom:1rem; }
    @media (max-width:768px) { #favoritesGrid, #popularGrid, #recentGrid, #friendGrid { grid-template-columns:repeat(2,1fr); } .games-grid { grid-template-columns:repeat(2,1fr); gap:1rem; } .game-desc { display:none; } .game-card { box-shadow:3px 3px 0 var(--border); } }
    @media (prefers-reduced-motion:reduce) { * { transition:none !important; } }

  </style>

  <script>
    /* Games come from games.json. To add a game, add one line there. */
    const PER_PAGE = 30;
    const FAV_KEY = 'geckoFavorites';
    const CFG = window.GECKO || {};
    const TWO = CFG.twoPlayer || [];
    let games = [], activeCat = 'All', page = 1;
    const $ = id => document.getElementById(id);
    const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

    function getFavs() { try { return JSON.parse(localStorage.getItem(FAV_KEY) || '[]'); } catch (e) { return []; } }
    function saveFavs(f) { try { localStorage.setItem(FAV_KEY, JSON.stringify(f)); } catch (e) {} }

    function cardHTML(g, isFav) {
      const starred = getFavs().includes(g.id);
      const btn = isFav
        ? `<button class="remove-fav-btn" data-remove="${esc(g.id)}">✕</button>`
        : `<button class="star-btn ${starred ? 'starred' : 'unstarred'}" data-id="${esc(g.id)}">${starred ? '★' : '☆'}</button>`;
      return `<a class="game-card" href="games/${esc(g.id)}/">
        ${g.new ? '<span class="badge-new">NEW</span>' : ''}
        <img src="${esc(g.img)}" loading="lazy" referrerpolicy="no-referrer" alt="${esc(g.title)}" onerror="this.style.visibility='hidden'"/>
        <div class="game-info">
          <div class="game-tag">${esc(g.category)}${g.tags.map(t => ` <span class="tag2">${esc(t)}</span>`).join('')}</div>
          <div class="game-title">${esc(g.title)}</div>
          <div class="game-desc">${esc(g.desc)}</div>
          <span class="play-btn">▶ Play</span>
          ${isFav ? '' : btn}
        </div>${isFav ? btn : ''}
      </a>`;
    }

    function query() { return $('searchBar').value.toLowerCase().trim(); }

    function filtered() {
      const q = query();
      if (q) return games.filter(g => (g.title + ' ' + g.category + ' ' + g.tags.join(' ') + ' ' + g.desc).toLowerCase().includes(q));
      return activeCat === 'All' ? games : games.filter(g => g.category === activeCat || g.tags.includes(activeCat));
    }

    function render() {
      const q = query();
      const list = filtered();
      const pages = Math.max(1, Math.ceil(list.length / PER_PAGE));
      if (page > pages) page = pages;
      const shown = q ? list : list.slice((page - 1) * PER_PAGE, page * PER_PAGE);
      $('gamesGrid').innerHTML = shown.map(g => cardHTML(g, false)).join('');
      $('noResults').style.display = list.length === 0 ? 'block' : 'none';
      $('pagination').style.display = $('pageInfo').style.display = (q || pages <= 1) ? 'none' : '';
      if (!q && pages > 1) {
        $('pageInfo').textContent = `Showing ${(page-1)*PER_PAGE+1}–${Math.min(page*PER_PAGE, list.length)} of ${list.length} games  ·  Page ${page} of ${pages}`;
        renderPagination(pages);
      }
      renderCats();
    }

    function renderPagination(pages) {
      const pg = $('pagination');
      pg.innerHTML = '';
      const add = (label, p, disabled, active) => {
        const b = document.createElement('button');
        b.textContent = label;
        b.disabled = !!disabled;
        if (active) b.classList.add('active');
        b.onclick = () => { page = p; render(); $('sports').scrollIntoView({ behavior: 'smooth', block: 'start' }); };
        pg.appendChild(b);
      };
      add('← Prev', page - 1, page === 1);
      for (let i = 1; i <= pages; i++) add(i, i, false, i === page);
      add('Next →', page + 1, page === pages);
    }

    function buildCats() {
      const counts = {};
      games.forEach(g => [g.category, ...g.tags].forEach(c => counts[c] = (counts[c] || 0) + 1));
      const cats = ['All', ...Object.keys(counts).sort()];
      $('catBar').innerHTML = cats.map(c =>
        `<button class="cat-btn" data-cat="${esc(c)}">${esc(c)}<small>${c === 'All' ? games.length : counts[c]}</small></button>`).join('') + '<button class="cat-btn rand" data-rand="1">🎲 Random</button>';
    }

    function renderCats() {
      const q = query();
      document.querySelectorAll('.cat-btn').forEach(b =>
        b.classList.toggle('active', !q && b.dataset.cat === activeCat));
    }

    function searchGames() { page = 1; render(); }

    function renderFavorites() {
      const favGames = getFavs().map(id => games.find(g => g.id === id)).filter(Boolean);
      $('favoritesGrid').innerHTML = favGames.map(g => cardHTML(g, true)).join('');
      $('favoritesSection').classList.toggle('has-favorites', favGames.length > 0);
    }

    function renderPopular() {
      const pop = games.filter(g => g.popular);
      $('popularGrid').innerHTML = pop.map(g => cardHTML(g, false)).join('');
      $('popularSection').classList.toggle('has-favorites', pop.length > 0);
    }

    function normalize(g) {
      g.tags = Array.isArray(g.tags) ? g.tags.slice() : [];
      if (g.category === '2 Player') { g.category = 'Action'; if (!g.tags.includes('2 Player')) g.tags.push('2 Player'); }
      if (TWO.includes(g.id) && !g.tags.includes('2 Player')) g.tags.push('2 Player');
      return g;
    }

    function renderRecent() {
      let ids = [];
      try { ids = JSON.parse(localStorage.getItem('geckoRecent') || '[]'); } catch (e) {}
      const list = ids.map(id => games.find(g => g.id === id)).filter(Boolean).slice(0, 4);
      $('recentGrid').innerHTML = list.map(g => cardHTML(g, false)).join('');
      $('recentSection').classList.toggle('has-favorites', list.length > 0);
    }

    function renderGotd() {
      if (!games.length) return;
      const g = games[Math.floor(Date.now() / 864e5) % games.length];
      $('gotd').innerHTML = `<a href="games/${esc(g.id)}/"><img src="${esc(g.img)}" referrerpolicy="no-referrer" alt="${esc(g.title)}" onerror="this.style.visibility='hidden'"/><div class="gotd-info"><div class="gotd-label">Game of the day</div><div class="gotd-title">${esc(g.title)}</div><div class="game-desc">${esc(g.desc)}</div><span class="play-btn">▶ Play</span></div></a>`;
      $('gotd').classList.add('show');
    }

    const BADGES = [[1, '🥚', 'First game'], [5, '🦎', '5 games'], [10, '🔥', '10 games'], [25, '⭐', '25 games'], [50, '👑', '50 games']];
    function renderStats() {
      let s = { xp: 0, played: [] };
      try { s = JSON.parse(localStorage.getItem('geckoStats') || '') || s; } catch (e) {}
      const n = s.played.length;
      $('statsBar').innerHTML = s.xp
        ? `🦎 Level <b>${Math.floor(s.xp / 100) + 1}</b> · <b>${s.xp}</b> XP · ${n} games tried ` + BADGES.filter(b => n >= b[0]).map(b => `<span title="${b[2]}">${b[1]}</span>`).join(' ')
        : '🦎 Play a game to start earning XP and badges';
    }

    function renderFriends() {
      const two = games.filter(g => g.tags.includes('2 Player'));
      const r = two.length ? Math.floor(Date.now() / 864e5) % two.length : 0;
      const list = two.slice(r).concat(two.slice(0, r)).slice(0, 4);
      $('friendGrid').innerHTML = list.map(g => cardHTML(g, false)).join('');
      $('friendSection').classList.toggle('has-favorites', list.length > 0);
    }

    function renderLinks() {
      let h = '';
      if (CFG.requestUrl) h += ' &nbsp;·&nbsp; <a href="' + esc(CFG.requestUrl) + '" target="_blank" rel="noopener">Request a game</a>';
      if (CFG.discordUrl) h += ' &nbsp;·&nbsp; <a href="' + esc(CFG.discordUrl) + '" target="_blank" rel="noopener">Discord</a>';
      $('reqLink').innerHTML = h;
      $('collLinks').innerHTML = ['2 Player', 'Sports', 'Racing', 'Action', 'Horror', 'Idle'].map(c =>
        `<a href="/best/${c.toLowerCase().replace(/ /g, '-')}-games/">Best ${esc(c)} Games</a>`).join(' &nbsp;·&nbsp; ');
    }

    function toggleFav(id) {
      let favs = getFavs();
      favs = favs.includes(id) ? favs.filter(f => f !== id) : [...favs, id];
      saveFavs(favs);
      renderFavorites();
      document.querySelectorAll('.star-btn').forEach(b => {
        const on = favs.includes(b.dataset.id);
        b.classList.toggle('starred', on);
        b.classList.toggle('unstarred', !on);
        b.textContent = on ? '★' : '☆';
      });
    }

    document.addEventListener('click', e => {
      const star = e.target.closest('.star-btn');
      const rem = e.target.closest('.remove-fav-btn');
      const cat = e.target.closest('.cat-btn:not(.rand)');
      const rnd = e.target.closest('[data-rand]');
      if (rnd) {
        const g = games[Math.floor(Math.random() * games.length)];
        location.href = 'games/' + g.id + '/';
      } else if (star || rem) {
        e.preventDefault(); e.stopPropagation();
        toggleFav((star || rem).dataset.id || rem.dataset.remove);
      } else if (cat) {
        $('searchBar').value = '';
        activeCat = cat.dataset.cat; page = 1; render();
